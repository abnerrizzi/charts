{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "greenbone.fullname" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "greenbone.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    {{- range .Values.nginx.ports }}
    - name: {{ .name }}
      port: {{ .containerPort }}
      targetPort: {{ .containerPort }}
      protocol: TCP
    {{- end }}
  selector:
    {{- include "greenbone.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
{{- end }}
