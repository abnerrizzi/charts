{{- if .Values.openvas.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greenbone.fullname" . }}-openvas
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "greenbone.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "greenbone.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: openvas
  template:
    metadata:
      labels:
        {{- include "greenbone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openvas
    spec:
      serviceAccountName: {{ include "greenbone.serviceAccountName" . }}
      initContainers:
        - name: wait-for-openvas-config
          image: busybox:1.36
          command: ['sh', '-c', 'echo "Waiting for openvas config..."; until [ -f /etc/openvas/openvas.conf ]; do echo "Waiting..."; sleep 5; done; echo "Config ready."']
          volumeMounts:
            - name: openvas-data
              mountPath: /etc/openvas
      containers:
        - name: openvas
          image: {{ include "greenbone.image" (dict "repository" .Values.openvas.image.repository "tag" .Values.openvas.image.tag "Chart" .Chart "Values" .Values) }}
          command:
            {{- toYaml .Values.openvas.command | nindent 12 }}
          volumeMounts:
            {{- range .Values.openvas.volumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        {{- range .Values.openvas.volumes }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ include "greenbone.fullname" $ }}-{{ .name }}vol
        {{- end }}
{{- end }}
