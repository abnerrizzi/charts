{{- if .Values.gsad.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greenbone.fullname" . }}-gsad
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "greenbone.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "greenbone.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gsad
  template:
    metadata:
      labels:
        {{- include "greenbone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gsad
    spec:
      serviceAccountName: {{ include "greenbone.serviceAccountName" . }}
      initContainers:
        - name: wait-for-gvmd
          image: busybox:1.36
          command: ['sh', '-c', 'echo "Waiting for gvmd socket..."; until [ -e /run/gvmd/gvmd.sock ]; do echo "Waiting..."; sleep 5; done; echo "gvmd ready."']
          volumeMounts:
            - name: gvmd-socket
              mountPath: /run/gvmd
      containers:
        - name: gsad
          image: {{ include "greenbone.image" (dict "repository" .Values.gsad.image.repository "tag" .Values.gsad.image.tag "Chart" .Chart "Values" .Values) }}
          env:
            {{- range $key, $value := .Values.gsad.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            {{- range .Values.gsad.volumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        {{- range .Values.gsad.volumes }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ include "greenbone.fullname" $ }}-{{ .name }}vol
        {{- end }}
{{- end }}
